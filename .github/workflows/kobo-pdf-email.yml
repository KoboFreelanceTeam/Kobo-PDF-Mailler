name: Kobo submission PDF email

on:
  # Fired by the Kobo REST Service on every new submission.
  repository_dispatch:
    types: [kobo_submission]
  # Manual (re)send of one submission, also handy for testing.
  workflow_dispatch:
    inputs:
      submission_id:
        description: Kobo submission _id to (re)send
        required: true
      asset_uid:
        description: Kobo project uid (leave empty for the KOBO_ASSET_UID variable)
        required: false

jobs:
  send-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # No "playwright install": the script uses the Google Chrome that is
      # preinstalled on ubuntu-latest, which saves ~20s per run.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Render PDF and send email
        run: python scripts/kobo_pdf_mailer.py
        env:
          # The submission payload is NOT passed here: env values are printed in the
          # run log. The script reads only the id from the event file on the runner.
          SUBMISSION_ID: ${{ inputs.submission_id }}
          KOBO_SERVER: ${{ vars.KOBO_SERVER }}
          # Kobo triggers carry their own project uid; this is only the fallback
          # for manual runs.
          KOBO_ASSET_UID: ${{ inputs.asset_uid || vars.KOBO_ASSET_UID }}
          ALLOWED_ASSET_UIDS: ${{ vars.ALLOWED_ASSET_UIDS }}
          EMAIL_FIELD: ${{ vars.EMAIL_FIELD }}
          FORM_LANGUAGE: ${{ vars.FORM_LANGUAGE }}
          MAIL_SUBJECT: ${{ vars.MAIL_SUBJECT }}
          MAIL_BODY: ${{ vars.MAIL_BODY }}
          MAIL_SIGNATURE_HTML: ${{ vars.MAIL_SIGNATURE_HTML }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ vars.MAIL_FROM_NAME }}
          MAIL_BCC: ${{ vars.MAIL_BCC }}
          MAIL_REPLY_TO: ${{ vars.MAIL_REPLY_TO }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # Outlook.com: OAuth2 instead of SMTP_PASSWORD (see README).
          OUTLOOK_CLIENT_ID: ${{ vars.OUTLOOK_CLIENT_ID }}
          OUTLOOK_TENANT: ${{ vars.OUTLOOK_TENANT }}
          OUTLOOK_REFRESH_TOKEN: ${{ secrets.OUTLOOK_REFRESH_TOKEN }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
